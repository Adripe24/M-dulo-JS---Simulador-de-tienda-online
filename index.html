<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="headerContainer" class="header-container">
        </div>
        
    </header>
    <main>
        <div id="shop-card" class="shopCard">
            <div class="shopCardContent">
                <div class="headerShopCardContent">
                    <h2>Carrito de Compra</h2>
                    <h3 id="cerrarCarrito">X</h3>
                </div>
                
            <ul>
                
                        <table id="lista-carrito" class="listaCarrito">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Total</th>
                                    <th>Accion</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="4">TOTAL</th>
                                    <th id="totalProducts">0$</th>
                                </tr>
                            </tfoot>
                        </table>

                        <button id="vaciar-carrito" class="vaciarCarritoBtn">Vaciar Carrito</button>

                        <button id="comprar-carrito" class="comprarCarritoBtn">Comprar</button>
                
            </ul>
            </div>
            
        </div>

        <div id="characterContainer" class="container">
        </div>

    </main>
    <footer>
        <div id="idFooter" class="footerContainer">
        </div>
    </footer>
  

<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
